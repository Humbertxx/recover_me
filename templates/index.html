{% extends "base.html" %}
{% block title %}Conversations{% endblock %}
{% block content %}
<div class="mb-8">
  <p class="text-sm font-medium text-sky-700">Recovered archive</p>
  <h1 class="mt-1 text-3xl font-bold tracking-tight">Conversations</h1>
</div>
<ul class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
{% for chat in chats %}
  <li class="border-b border-slate-200 last:border-0">
    <a class="flex items-center justify-between gap-4 px-5 py-4 transition hover:bg-slate-50" href="chat-{{ chat.id }}.html">
      <span class="font-medium text-slate-900">{{ chat.title }}</span>
      <span class="shrink-0 text-sm text-slate-500">{{ chat.messages|length }} messages</span>
    </a>
  </li>
{% else %}
  <li class="px-5 py-8 text-center text-slate-500">No conversations found.</li>
{% endfor %}
</ul>
{% endblock %}
