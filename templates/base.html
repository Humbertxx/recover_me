<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recovered Conversations{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center px-4 py-4 sm:px-6">
      <a class="text-lg font-semibold tracking-tight text-slate-900" href="index.html">Recovered Conversations</a>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
