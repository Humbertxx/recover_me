[project]
name = "recover-me"
version = "0.1.0"
description = "Extract and render Telegram data from an iOS backup"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "mvt",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
